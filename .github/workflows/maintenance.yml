name: Prastav hourly maintenance

# Calls the site's scheduled job once an hour: reminder emails for drafts about
# to lock, stuck-proposal cleanup and expired-draft purge.
# Needs a repository secret CRON_SECRET with the same value as CRON_SECRET in Render.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduled job
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET not set; skipping."; exit 0; fi
          curl -fsS --max-time 120 -X POST https://prastav.app/api/cron -H "Authorization: Bearer $CRON_SECRET"
